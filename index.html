<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-LLM Thinking View</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #8a8f9a;
    --claude: #d97757;
    --gpt: #10a37f;
    --gemini: #4285f4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .cols {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    overflow: hidden;
  }
  .col {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .col-head {
    padding: 10px 14px;
    font-weight: 600;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .col[data-model="claude"] .dot { background: var(--claude); }
  .col[data-model="gpt"] .dot { background: var(--gpt); }
  .col[data-model="gemini"] .dot { background: var(--gemini); }
  .thinking {
    margin: 10px 14px 0;
    padding: 8px 10px;
    background: #1d212b;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--muted);
    display: none;
    white-space: pre-wrap;
  }
  .thinking.show { display: block; }
  .thinking summary { cursor: pointer; color: var(--muted); }
  .response {
    flex: 1;
    padding: 14px;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .placeholder { color: var(--muted); font-style: italic; }
  .status { font-size: 11px; color: var(--muted); padding: 0 14px 10px; }
  footer {
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  footer input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
  }
  footer input:focus { outline: 1px solid #4a90ff; }
  footer button {
    background: #4a90ff;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
  }
  footer button:hover { background: #3a7ae0; }
  footer button:disabled { background: #333; cursor: not-allowed; }
  .note {
    padding: 8px 20px;
    font-size: 11px;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }
  @media (max-width: 800px) {
    .cols { grid-template-columns: 1fr; grid-auto-rows: minmax(200px, 1fr); overflow-y: auto; }
  }
</style>
</head>
<body>

<header>
  <h1>Multi-LLM Thinking View</h1>
  <span class="status" id="globalStatus">Mock mode — see README to wire real API keys</span>
</header>

<div class="cols">
  <div class="col" data-model="claude">
    <div class="col-head"><span class="dot"></span>Claude</div>
    <details class="thinking" id="think-claude"><summary>Thinking</summary><span class="think-text"></span></details>
    <div class="response" id="resp-claude"><span class="placeholder">Waiting for a prompt…</span></div>
  </div>
  <div class="col" data-model="gpt">
    <div class="col-head"><span class="dot"></span>ChatGPT</div>
    <details class="thinking" id="think-gpt"><summary>Thinking</summary><span class="think-text"></span></details>
    <div class="response" id="resp-gpt"><span class="placeholder">Waiting for a prompt…</span></div>
  </div>
  <div class="col" data-model="gemini">
    <div class="col-head"><span class="dot"></span>Gemini</div>
    <details class="thinking" id="think-gemini"><summary>Thinking</summary><span class="think-text"></span></details>
    <div class="response" id="resp-gemini"><span class="placeholder">Waiting for a prompt…</span></div>
  </div>
</div>

<div class="note">Toggle "Thinking" per model to see simulated reasoning. Real API wiring: see README.md.</div>

<footer>
  <input id="promptInput" type="text" placeholder="Ask all three models…" />
  <button id="sendBtn">Send</button>
</footer>

<script src="app.js"></script>
</body>
</html>
